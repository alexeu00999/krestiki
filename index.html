<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10121c" />
    <meta
      name="description"
      content="Классические крестики-нолики для двух игроков на одном экране."
    />
    <title>Крестики × Нолики — локальная аркада</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="space-scene" aria-hidden="true">
      <div class="star-field star-field-large"></div>
      <div class="star-field star-field-small"></div>
      <div class="star-glow star-glow-one"></div>
      <div class="star-glow star-glow-two"></div>
      <span class="shooting-star shooting-star-one"></span>
      <span class="shooting-star shooting-star-two"></span>

      <svg class="space-ship space-ship-one" viewBox="0 0 180 88" fill="none">
        <path d="M16 53c25-30 65-40 132-29l20 13-20 13c-64 13-107 8-132 3Z" fill="#2E314B" stroke="#A995FF" stroke-width="2" />
        <path d="M51 42c18-18 38-22 60-21l-15 28c-17 1-31-1-45-7Z" fill="#7770B3" opacity=".8" />
        <path d="m149 37 21-1-15 13-18 1 12-13Z" fill="#FF907D" />
        <path d="M28 53 8 62l17-22" stroke="#FF907D" stroke-width="4" stroke-linecap="round" />
        <circle cx="76" cy="39" r="4" fill="#B9AEFF" />
        <path d="M106 33 98 18M117 34l-1-18" stroke="#9C7DFF" stroke-width="2" stroke-linecap="round" />
      </svg>

      <svg class="space-ship space-ship-two" viewBox="0 0 180 88" fill="none">
        <path d="M16 53c25-30 65-40 132-29l20 13-20 13c-64 13-107 8-132 3Z" fill="#282D47" stroke="#82E2BD" stroke-width="2" />
        <path d="M51 42c18-18 38-22 60-21l-15 28c-17 1-31-1-45-7Z" fill="#5A8F91" opacity=".8" />
        <path d="m149 37 21-1-15 13-18 1 12-13Z" fill="#9C7DFF" />
        <path d="M28 53 8 62l17-22" stroke="#82E2BD" stroke-width="4" stroke-linecap="round" />
        <circle cx="76" cy="39" r="4" fill="#C3FFE8" />
        <path d="M106 33 98 18M117 34l-1-18" stroke="#82E2BD" stroke-width="2" stroke-linecap="round" />
      </svg>

      <svg class="space-ship space-ship-three" viewBox="0 0 180 88" fill="none">
        <path d="M16 53c25-30 65-40 132-29l20 13-20 13c-64 13-107 8-132 3Z" fill="#30314A" stroke="#FFB09E" stroke-width="2" />
        <path d="M51 42c18-18 38-22 60-21l-15 28c-17 1-31-1-45-7Z" fill="#9A6376" opacity=".82" />
        <path d="m149 37 21-1-15 13-18 1 12-13Z" fill="#82E2BD" />
        <path d="M28 53 8 62l17-22" stroke="#FFB09E" stroke-width="4" stroke-linecap="round" />
        <circle cx="76" cy="39" r="4" fill="#FFE0D8" />
        <path d="M106 33 98 18M117 34l-1-18" stroke="#FFB09E" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="game-shell">
      <header class="hero">
        <div class="eyebrow"><span class="eyebrow-dot"></span> LOCAL ARCADE · 2 PLAYERS</div>
        <h1>Крестики <span class="title-mark">×</span> нолики</h1>
        <p class="hero-copy">Два хода. Одно поле. Кто первым соберёт линию?</p>
      </header>

      <section class="game-card" aria-label="Игра в крестики-нолики">
        <div class="top-row">
          <div class="round-info">
            <span class="round-label">ПАРТИЯ</span>
            <span class="round-number" id="round-number">01</span>
          </div>

          <div class="scoreboard" aria-label="Счёт">
            <div class="score score-x" id="score-card-x">
              <span class="score-symbol">X</span>
              <span class="score-name">ИГРОК X</span>
              <strong id="score-x">0</strong>
            </div>
            <div class="score-divider" aria-hidden="true">:</div>
            <div class="score score-o" id="score-card-o">
              <span class="score-symbol">O</span>
              <span class="score-name">ИГРОК O</span>
              <strong id="score-o">0</strong>
            </div>
          </div>
        </div>

        <div class="status-panel" aria-live="polite">
          <span class="status-kicker" id="status-kicker">СЕЙЧАС ХОДИТ</span>
          <strong class="status-message" id="game-status">Игрок X</strong>
          <span class="status-hint" id="status-hint">Выберите клетку на поле</span>
        </div>

        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Игровое поле 3 на 3">
            <button class="cell" type="button" role="gridcell" data-cell-index="0" aria-label="Клетка 1"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="1" aria-label="Клетка 2"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="2" aria-label="Клетка 3"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="3" aria-label="Клетка 4"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="4" aria-label="Клетка 5"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="5" aria-label="Клетка 6"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="6" aria-label="Клетка 7"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="7" aria-label="Клетка 8"></button>
            <button class="cell" type="button" role="gridcell" data-cell-index="8" aria-label="Клетка 9"></button>
          </div>
        </div>

        <div class="controls">
          <button class="button button-primary" id="new-round" type="button">
            <span>Новая партия</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="button button-quiet" id="reset-score" type="button">Сбросить счёт</button>
        </div>
      </section>

      <footer class="page-footer">
        <span><kbd>R</kbd> новая партия</span>
        <span class="footer-separator" aria-hidden="true">•</span>
        <span>Играйте честно</span>
      </footer>
    </main>
  </body>
</html>
